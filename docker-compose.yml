services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campus_app
      POSTGRES_PASSWORD: campus_dev_password
      POSTGRES_DB: campus_events
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_app -d campus_events"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://campus_app:campus_dev_password@db:5432/campus_events
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data: