<!doctype html>
<html lang="mk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: "Montserrat", sans-serif;
    }
  </style>
</head>

<body class="min-h-screen bg-slate-200 text-slate-900">
  <main class="mx-auto min-h-screen max-w-md bg-slate-100 pb-8 shadow-xl">
    <header class="bg-gradient-to-br from-blue-700 to-indigo-700 px-5 pb-8 pt-7 text-white">
      <div class="flex items-center justify-center gap-3">
        <img
          src="assets/campus-logo.png"
          alt="Campus event application logo"
          class="h-20 w-20 shrink-0 rounded-2xl bg-white object-contain p-1 shadow-lg"
        >

        <div>
          <h1 class="text-3xl font-bold">
            Campus Events
          </h1>
        </div>
      </div>
    </header>

    <section class="-mt-4 px-4">
      <div class="rounded-2xl bg-slate-50 p-4 shadow-md">
        <label for="student-select" class="mb-2 block text-xs font-bold uppercase tracking-wide text-slate-500">
          Student profile
        </label>

        <select
          id="student-select"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm font-semibold text-slate-800 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        ></select>
      </div>
    </section>

    <section class="px-4 pt-6">
      <div class="mb-4 flex items-center justify-between">
        <div>
          <h2 class="text-xl font-bold">For you</h2>
          <p class="text-sm text-slate-500">Recommended campus events</p>
        </div>

        <span class="rounded-full bg-blue-100 px-3 py-1 text-xs font-bold text-blue-700">
          Personal
        </span>
      </div>

      <p id="loading-state" class="hidden rounded-2xl bg-slate-50 p-6 text-center text-sm font-medium text-slate-500 shadow-sm">
        Loading recommendations...
      </p>

      <p id="error-state" class="hidden rounded-2xl border border-red-200 bg-red-50 p-4 text-sm text-red-700"></p>

      <p id="empty-state" class="hidden rounded-2xl bg-slate-50 p-6 text-center text-sm text-slate-500 shadow-sm">
        No recommended events are currently available.
      </p>

      <section id="recommendations" class="space-y-4"></section>

      <div id="load-more-container" class="mt-5 hidden text-center">
        <button
          id="load-more-button"
          type="button"
          class="w-full rounded-xl border border-blue-200 bg-slate-50 py-3 text-sm font-bold text-blue-700 shadow-sm transition active:scale-[0.98] hover:bg-blue-50"
        >
          Load more
        </button>
      </div>
    </section>

    <section class="mt-8 px-4">
      <details class="rounded-2xl bg-slate-50 shadow-sm" open>
        <summary class="flex cursor-pointer list-none items-center justify-between p-4 text-base font-bold">
          Browse all events
          <span class="text-blue-600">Filter</span>
        </summary>

        <form id="event-filter-form" class="space-y-3 border-t border-slate-100 p-4">
          <select
            id="category-filter"
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm outline-none focus:border-blue-500"
          >
            <option value="">All categories</option>
            <option>Technology</option>
            <option>Career</option>
            <option>Business</option>
            <option>Art</option>
            <option>Music</option>
            <option>Sport</option>
            <option>Volunteering</option>
            <option>Culture</option>
            <option>Science</option>
            <option>Networking</option>
            <option>Workshop</option>
            <option>Competition</option>
            <option>Health</option>
            <option>Student Club</option>
            <option>Language</option>
          </select>

          <input
            id="date-filter"
            type="date"
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-3 text-sm outline-none focus:border-blue-500"
          >

          <label class="flex items-center gap-3 rounded-xl bg-slate-50 px-3 py-3 text-sm font-semibold">
            <input id="free-only-filter" type="checkbox" class="h-5 w-5 accent-blue-600">
            Show free events only
          </label>

          <button
            type="submit"
            class="w-full rounded-xl bg-blue-600 py-3 text-sm font-bold text-white transition active:scale-[0.98] hover:bg-blue-700"
          >
            Apply filters
          </button>
        </form>
      </details>

      <p id="events-state" class="mt-4 text-center text-sm text-slate-500">
        Select filters to browse all events.
      </p>

      <section id="events-results" class="mt-4 space-y-3"></section>
    </section>
  </main>

  <script>
    const API_BASE_URL = "/api";

    const studentSelect = document.querySelector("#student-select");
    const recommendationsContainer = document.querySelector("#recommendations");
    const loadMoreContainer = document.querySelector("#load-more-container");
    const loadMoreButton = document.querySelector("#load-more-button");
    const loadingState = document.querySelector("#loading-state");
    const errorState = document.querySelector("#error-state");
    const emptyState = document.querySelector("#empty-state");

    const eventFilterForm = document.querySelector("#event-filter-form");
    const categoryFilter = document.querySelector("#category-filter");
    const dateFilter = document.querySelector("#date-filter");
    const freeOnlyFilter = document.querySelector("#free-only-filter");
    const eventsState = document.querySelector("#events-state");
    const eventsResults = document.querySelector("#events-results");

    const RECOMMENDATIONS_PER_PAGE = 5;
    let allRecommendations = [];
    let visibleRecommendationCount = RECOMMENDATIONS_PER_PAGE;


    function setState(state, message = "") {
      loadingState.classList.toggle("hidden", state !== "loading");
      errorState.classList.toggle("hidden", state !== "error");
      emptyState.classList.toggle("hidden", state !== "empty");

      if (state === "error") {
        errorState.textContent = message;
      }
    }


    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => {
        const characters = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        };

        return characters[character];
      });
    }


    function formatDateTime(value) {
      return new Intl.DateTimeFormat("mk-MK", {
        dateStyle: "medium",
        timeStyle: "short",
      }).format(new Date(value));
    }


    function recommendationCard(event) {
      const price = Number(event.price) === 0 ? "FREE" : `€${event.price}`;

      return `
        <article class="overflow-hidden rounded-2xl bg-slate-50 shadow-sm ring-1 ring-slate-200">
          <div class="flex items-start justify-between gap-3 p-4 pb-3">
            <div>
              <span class="rounded-full bg-blue-100 px-2.5 py-1 text-xs font-bold text-blue-700">
                ${escapeHtml(event.category)}
              </span>

              <h3 class="mt-3 text-lg font-bold leading-6">
                ${escapeHtml(event.title)}
              </h3>
            </div>

            <span class="shrink-0 rounded-xl bg-emerald-100 px-2 py-1 text-sm font-bold text-emerald-700">
              ${event.score}
            </span>
          </div>

          <div class="space-y-2 px-4 pb-4 text-sm text-slate-600">
            <p>📍 ${escapeHtml(event.location_name)}</p>
            <p>📅 ${formatDateTime(event.start_datetime)}</p>
            <p>👤 ${escapeHtml(event.organizer)}</p>
          </div>

          <div class="grid grid-cols-3 border-y border-slate-100 bg-slate-50 text-center text-xs">
            <div class="p-3">
              <p class="text-slate-400">Distance</p>
              <p class="mt-1 font-bold text-slate-700">${event.distance_km} km</p>
            </div>

            <div class="border-x border-slate-100 p-3">
              <p class="text-slate-400">Price</p>
              <p class="mt-1 font-bold text-slate-700">${price}</p>
            </div>

            <div class="p-3">
              <p class="text-slate-400">Places</p>
              <p class="mt-1 font-bold text-slate-700">${event.available_places}</p>
            </div>
          </div>

          <p class="m-4 rounded-xl border-l-4 border-blue-500 bg-blue-50 p-3 text-sm leading-5 text-slate-700">
            ${escapeHtml(event.reason)}
          </p>
        </article>
      `;
    }


    function renderRecommendations() {
      recommendationsContainer.innerHTML = "";

      if (allRecommendations.length === 0) {
        setState("empty");
        loadMoreContainer.classList.add("hidden");
        return;
      }

      setState("");
      const visibleRecommendations = allRecommendations.slice(
        0,
        visibleRecommendationCount,
      );

      recommendationsContainer.innerHTML = visibleRecommendations
        .map(recommendationCard)
        .join("");

      loadMoreContainer.classList.toggle(
        "hidden",
        visibleRecommendationCount >= allRecommendations.length,
      );
    }


    async function loadRecommendations(studentId) {
      setState("loading");
      recommendationsContainer.innerHTML = "";
      loadMoreContainer.classList.add("hidden");

      try {
        const response = await fetch(
          `${API_BASE_URL}/recommendations/${studentId}`,
        );

        if (!response.ok) {
          throw new Error("Could not load recommendations.");
        }

        const data = await response.json();
        allRecommendations = data.recommendations;
        visibleRecommendationCount = RECOMMENDATIONS_PER_PAGE;
        renderRecommendations();
      } catch (error) {
        setState("error", error.message);
      }
    }


    function renderEvents(events) {
      eventsResults.innerHTML = "";

      if (events.length === 0) {
        eventsState.textContent = "No events match the selected filters.";
        return;
      }

      eventsState.textContent = `${events.length} event(s) found.`;

      eventsResults.innerHTML = events.map((event) => {
        const price = Number(event.price) === 0 ? "FREE" : `€${event.price}`;
        const availablePlaces = event.capacity - event.registered_count;

        return `
          <article class="rounded-2xl bg-slate-50 p-4 shadow-sm ring-1 ring-slate-200">
            <div class="flex items-start justify-between gap-3">
              <div>
                <span class="rounded-full bg-blue-100 px-2.5 py-1 text-xs font-bold text-blue-700">
                  ${escapeHtml(event.category)}
                </span>

                <h3 class="mt-3 font-bold leading-5">
                  ${escapeHtml(event.title)}
                </h3>
              </div>

              <span class="shrink-0 text-sm font-bold text-blue-700">${price}</span>
            </div>

            <p class="mt-3 text-sm text-slate-600">
              📍 ${escapeHtml(event.location_name)}
            </p>

            <p class="mt-2 text-sm text-slate-600">
              📅 ${formatDateTime(event.start_datetime)}
            </p>

            <p class="mt-2 text-sm text-slate-600">
              Available places: <strong>${availablePlaces}</strong>
            </p>
          </article>
        `;
      }).join("");
    }


    async function loadFilteredEvents() {
      const parameters = new URLSearchParams();

      if (categoryFilter.value) {
        parameters.set("category", categoryFilter.value);
      }

      if (dateFilter.value) {
        parameters.set("date", dateFilter.value);
      }

      if (freeOnlyFilter.checked) {
        parameters.set("free_only", "true");
      }

      eventsState.textContent = "Loading events...";
      eventsResults.innerHTML = "";

      try {
        const response = await fetch(
          `${API_BASE_URL}/events?${parameters.toString()}`,
        );

        if (!response.ok) {
          throw new Error("Could not load filtered events.");
        }

        renderEvents(await response.json());
      } catch (error) {
        eventsState.textContent = error.message;
      }
    }


    async function loadStudents() {
      setState("loading");

      try {
        const response = await fetch(`${API_BASE_URL}/students`);

        if (!response.ok) {
          throw new Error("Could not load students.");
        }

        const students = await response.json();

        studentSelect.innerHTML = students.map((student) => `
          <option value="${student.id}">
            ${escapeHtml(student.name)} — ${escapeHtml(student.faculty)}
          </option>
        `).join("");

        const selectedId = new URLSearchParams(window.location.search)
          .get("student_id") || students[0].id;

        studentSelect.value = selectedId;
        await loadRecommendations(selectedId);
      } catch (error) {
        setState("error", error.message);
      }
    }


    studentSelect.addEventListener("change", async () => {
      const studentId = studentSelect.value;

      window.history.replaceState({}, "", `?student_id=${studentId}`);
      await loadRecommendations(studentId);
    });


    loadMoreButton.addEventListener("click", () => {
      visibleRecommendationCount += RECOMMENDATIONS_PER_PAGE;
      renderRecommendations();
    });


    eventFilterForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      await loadFilteredEvents();
    });


    loadStudents();
  </script>
</body>
</html>
